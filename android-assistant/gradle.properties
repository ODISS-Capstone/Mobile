# ── ODISS ai-server 연결 설정 ──
# 기본값은 에뮬레이터(10.0.2.2)를 향한다. 실기기에서는 아래 값을 덮어쓰거나
# 빌드시 -P 인자로 주입한다. 예:
#   ./gradlew :app:assembleDebug \
#     -PodissHttpBaseUrl=http://192.168.0.12:8000 \
#     -PodissWsBaseUrl=ws://192.168.0.12:8000/ws/chat
# odissHttpBaseUrl=http://10.0.2.2:8000
# odissWsBaseUrl=ws://10.0.2.2:8000/ws/chat
# odissSpeakerId=android_default
# odissWsToken=
