org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ── ODISS ai-server 연결 설정 ──
# 기본값은 운영 도메인(https://odiss.p-e.kr, wss://odiss.p-e.kr/ws/chat)을 향한다.
# 에뮬레이터나 내부망 테스트는 빌드시 -P 인자로 덮어쓴다. 예:
#   ./gradlew :app:assembleDebug \
#     -PodissHttpBaseUrl=http://10.0.2.2:8000 \
#     -PodissWsBaseUrl=ws://10.0.2.2:8000/ws/chat
# odissHttpBaseUrl=https://odiss.p-e.kr
# odissWsBaseUrl=wss://odiss.p-e.kr/ws/chat
# odissSpeakerId=android_default
# odissWsToken=
